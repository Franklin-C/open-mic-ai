name: Build and test
on:
  push:
    paths: ['windows/**', 'macos/**', 'streamdeck/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  streamdeck:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - run: npm ci
      - run: npm run pack
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMicAI-StreamDeck
          path: streamdeck/dist/*.streamDeckPlugin
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows app
        shell: powershell
        run: ./windows/Build.ps1
      - name: Word guards and bounded repair tests
        shell: powershell
        run: ./windows/validation/RunCoreChecks.ps1
      - name: Dictation bar, taskbar and settings tests
        shell: powershell
        run: ./windows/validation/RunBarChecks.ps1
      - name: Statistics and taskbar command tests
        shell: powershell
        run: ./windows/validation/RunStatsChecks.ps1
      - name: Keyboard and mouse shortcut tests
        shell: powershell
        run: ./windows/validation/RunMouseShortcutChecks.ps1
      - name: Local Stream Deck bridge tests
        shell: powershell
        run: ./windows/validation/RunStreamDeckChecks.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMicAI-Windows-source-build
          path: windows/OpenMicAI.exe
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: macos/.build/runtime
          key: engines-${{ matrix.runner }}-d2a764c-69ecae9-portable-cpu-v1
      - name: Build, test and package native Mac app
        run: bash macos/build.sh
      - name: Check local engine executables
        run: |
          macos/.build/runtime/whisper-server --help
          macos/.build/runtime/llama-server --version
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMicAI-${{ matrix.runner }}
          path: macos/dist/*.zip
